<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สยามฟาร์มมิ่ง - Stardew Style</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Tahoma', sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 520px;
            background: #4d7c0f;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            overflow: hidden;
            border-radius: 8px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            cursor: pointer;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
        }
        .hud-box {
            background: rgba(40, 26, 13, 0.85);
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid #d4af37;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #hotbar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(40, 26, 13, 0.9);
            padding: 6px 10px;
            border-radius: 12px;
            border: 2px solid #d4af37;
            z-index: 5;
        }
        .slot {
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #854d0e;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.15s;
            position: relative;
        }
        .slot.selected {
            border-color: #fde047;
            background: rgba(253, 224, 71, 0.3);
            transform: scale(1.1);
        }
        .slot-badge {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 0 3px;
            border-radius: 4px;
        }
        #toast {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 26, 13, 0.95);
            color: #fde047;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #d4af37;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="toast">แจ้งเตือน</div>
    <div id="hud">
        <div class="hud-box" id="time-display">🌞 08:00 น. (วันแรก)</div>
        <div class="hud-box" id="money-display">💰 500 บาท</div>
        <div class="hud-box" id="energy-display">⚡ 100/100</div>
    </div>

    <canvas id="gameCanvas" width="900" height="520"></canvas>

    <div id="hotbar">
        <div class="slot selected" onclick="selectSlot(0)">🪓<span class="slot-badge">จอบ</span></div>
        <div class="slot" onclick="selectSlot(1)">🚿<span class="slot-badge">รดน้ำ</span></div>
        <div class="slot" onclick="selectSlot(2)">🌾<span class="slot-badge" id="b-rice">3</span></div>
        <div class="slot" onclick="selectSlot(3)">🌶️<span class="slot-badge" id="b-chili">2</span></div>
        <div class="slot" onclick="selectSlot(4)">🗡️<span class="slot-badge">เกี่ยว</span></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let money = 500;
    let energy = 100;
    let day = 1;
    let gameMinutes = 8 * 60;
    let selectedTool = 0;

    let inventory = { riceSeeds: 3, chiliSeeds: 2 };

    let player = {
        x: 450, y: 320,
        targetX: 450, targetY: 320,
        speed: 2.2, isMoving: false,
        facing: 'down', animFrame: 0, animTimer: 0
    };

    // แปลงเกษตรสไตล์ Stardew
    let farmGrid = [];
    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 5; c++) {
            farmGrid.push({
                x: 280 + c * 65,
                y: 260 + r * 55,
                state: 'grass',
                crop: null,
                growthStage: 0
            });
        }
    }

    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playSound(type) {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'step') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(90, now);
            gain.gain.setValueAtTime(0.02, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'farm') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.06, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(987, now);
            osc.frequency.setValueAtTime(1318, now + 0.08);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        }
    }

    setInterval(() => {
        gameMinutes += 2;
        if (gameMinutes >= 24 * 60) { gameMinutes = 0; day++; energy = 100; showToast(`🌅 วันที่ ${day} เริ่มขึ้นแล้ว!`); }
        updateUI();
    }, 1000);

    function updateUI() {
        let hrs = Math.floor(gameMinutes / 60);
        let mins = gameMinutes % 60;
        document.getElementById('time-display').innerText = `🌞 ${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')} น. (วันที่ ${day})`;
        document.getElementById('money-display').innerText = `💰 ${money} บาท`;
        document.getElementById('energy-display').innerText = `⚡ ${energy}/100`;
        document.getElementById('b-rice').innerText = inventory.riceSeeds;
        document.getElementById('b-chili').innerText = inventory.chiliSeeds;
    }

    function selectSlot(i) {
        selectedTool = i;
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('selected', idx === i));
        playSound('step');
    }

    let toastTimer;
    function showToast(txt) {
        const t = document.getElementById('toast'); t.innerText = txt; t.style.opacity = '1';
        clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
    }

    canvas.addEventListener('pointerdown', (e) => {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

        let plot = farmGrid.find(p => Math.abs(p.x - cx) < 30 && Math.abs(p.y - cy) < 24);
        if (plot) {
            player.targetX = plot.x; player.targetY = plot.y + 20;
            setTimeout(() => doAction(plot), 300);
        } else {
            player.targetX = cx; player.targetY = cy;
        }
    });

    function doAction(p) {
        if (energy < 5) { showToast("พลังงานหมด! พักผ่อนก่อน"); return; }
        if (selectedTool === 0 && p.state === 'grass') {
            p.state = 'tilled'; energy -= 5; playSound('farm'); showToast("พรวนดินเรียบร้อย");
        } else if (selectedTool === 1 && p.state === 'tilled') {
            p.state = 'watered'; energy -= 3; playSound('farm'); showToast("รดน้ำแล้ว 💧");
        } else if (selectedTool === 2 && p.state === 'watered' && !p.crop) {
            if (inventory.riceSeeds > 0) { inventory.riceSeeds--; p.crop = 'rice'; p.growthStage = 2; energy -= 4; playSound('farm'); showToast("ปลูกข้าวแล้ว 🌾"); }
            else showToast("เมล็ดข้าวหมด!");
        } else if (selectedTool === 3 && p.state === 'watered' && !p.crop) {
            if (inventory.chiliSeeds > 0) { inventory.chiliSeeds--; p.crop = 'chili'; p.growthStage = 2; energy -= 4; playSound('farm'); showToast("ปลูกพริกแล้ว 🌶️"); }
            else showToast("เมล็ดพริกหมด!");
        } else if (selectedTool === 4 && p.crop) {
            let rew = p.crop === 'rice' ? 120 : 150;
            money += rew; p.state = 'grass'; p.crop = null; energy -= 5;
            playSound('coin'); showToast(`เกี่ยวสำเร็จ! +${rew} ฿ 💰`);
        }
        updateUI();
    }

    function updatePlayer() {
        let dx = player.targetX - player.x, dy = player.targetY - player.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2) {
            player.isMoving = true;
            player.x += (dx / dist) * player.speed; player.y += (dy / dist) * player.speed;
            player.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
            player.animTimer++;
            if (player.animTimer % 8 === 0) { player.animFrame = (player.animFrame + 1) % 4; playSound('step'); }
        } else { player.isMoving = false; player.animFrame = 0; }
    }

    // --- ฟังก์ชันวาดกราฟิกสไตล์ Stardew Valley แบบพิกเซล ---
    function drawScene() {
        // 1. พื้นดินและพื้นหญ้า (Grass & Dirt Background)
        ctx.fillStyle = '#65a30d'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#a16207'; ctx.fillRect(0, 180, canvas.width, 340); // โซนดินฟาร์ม

        // 2. บ้านไม้ฟาร์ม (Stardew House) ด้านบน
        ctx.fillStyle = '#78350f'; ctx.fillRect(320, 40, 260, 140); // ตัวบ้าน
        ctx.fillStyle = '#991b1b'; // หลังคาแดง
        ctx.beginPath(); ctx.moveTo(290, 40); ctx.lineTo(450, 10); ctx.lineTo(610, 40); ctx.fill();
        ctx.fillStyle = '#451a03'; ctx.fillRect(430, 110, 40, 70); // ประตูบ้าน
        ctx.fillStyle = '#fde047'; ctx.fillRect(350, 70, 30, 30); ctx.fillRect(520, 70, 30, 30); // หน้าต่าง

        // 3. บ่อน้ำทางขวา (Water Well)
        ctx.fillStyle = '#713f12'; ctx.fillRect(720, 320, 70, 70);
        ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(755, 355, 22, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#991b1b'; ctx.fillRect(710, 305, 90, 20); // หลังคาบ่อน้ำ

        // 4. พุ่มไม้และต้นไม้ประดับรอบฉาก
        drawBush(80, 100); drawBush(150, 80); drawBush(820, 120);
        drawBush(50, 450); drawBush(130, 480);

        // 5. แปลงเกษตร (Farm Plots)
        farmGrid.forEach(p => {
            ctx.fillStyle = p.state === 'grass' ? '#3f6212' : (p.state === 'tilled' ? '#573318' : '#31190a');
            ctx.fillRect(p.x - 28, p.y - 20, 56, 40);
            ctx.strokeStyle = '#231206'; ctx.lineWidth = 2;
            ctx.strokeRect(p.x - 28, p.y - 20, 56, 40);

            // พืชผลพิกเซล
            if (p.crop === 'rice') {
                ctx.fillStyle = '#facc15'; // ข้าวงอกงาม
                ctx.fillRect(p.x - 12, p.y - 25, 8, 24);
                ctx.fillRect(p.x + 4, p.y - 22, 8, 20);
            } else if (p.crop === 'chili') {
                ctx.fillStyle = '#16a34a'; ctx.fillRect(p.x - 10, p.y - 22, 20, 22);
                ctx.fillStyle = '#dc2626'; ctx.fillRect(p.x - 4, p.y - 15, 8, 10); // เม็ดพริกแดง
            }
        });
    }

    function drawBush(x, y) {
        ctx.fillStyle = '#166534';
        ctx.beginPath(); ctx.arc(x, y, 22, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#22c55e';
        ctx.beginPath(); ctx.arc(x - 6, y - 6, 12, 0, Math.PI*2); ctx.fill();
    }

    function drawPlayer() {
        ctx.save(); ctx.translate(player.x, player.y);
        let leg = player.isMoving ? Math.sin(player.animFrame * Math.PI / 2) * 4 : 0;
        
        // ขา
        ctx.fillStyle = '#1c1c1c'; ctx.fillRect(-5, 4 + leg, 4, 10); ctx.fillRect(1, 4 - leg, 4, 10);
        // เสื้อชาวนา Stardew (เอี๊ยมยีนส์)
        ctx.fillStyle = '#2563eb'; ctx.fillRect(-8, -12, 16, 18);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, -10, 8, 8); // เสื้อด้านใน
        // หัว
        ctx.fillStyle = '#fde68a'; ctx.fillRect(-6, -22, 12, 10);
        // หมวกฟาง
        ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.arc(0, -22, 14, Math.PI, 0, false); ctx.fill();
        
        ctx.restore();
    }

    function loop() {
        updatePlayer();
        drawScene();
        drawPlayer();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
